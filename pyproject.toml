[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dss_toolkit"
version = "0.1.0"
description = "Reusable OpenDSS (DSS-Python) bricks for power flow and DER hosting capacity studies"
requires-python = ">=3.9"
dependencies = ["dss-python", "numpy", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
